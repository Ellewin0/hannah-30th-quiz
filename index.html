<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Which Hannah Are You? | 30th Birthday Quiz</title>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');
        .font-handwriting { font-family: 'Dancing Script', cursive; }
    </style>
</head>
<body class="bg-[#F0F9FF]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Custom Icon component to replace external Lucide dependency that was causing errors
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Plane: <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" />,
                Map: <path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4zm7-4v16m8 4V6" />,
                Music: <g><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></g>,
                Wine: <g><path d="M8 22h8"/><path d="M12 11v11"/><path d="m19 10-7 7-7-7"/><path d="M12 15a5 5 0 0 0 5-5V2H7v8a5 5 0 0 0 5 5Z"/></g>,
                Sun: <g><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></g>,
                Camera: <g><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></g>,
                RefreshCw: <g><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></g>,
                ChevronRight: <path d="m9 18 6-6-6-6"/>,
                Palmtree: <g><path d="M13 8c0-2.76-2.24-5-5-5s-5 2.24-5 5"/><path d="M13 7.14A5.82 5.82 0 0 1 16.5 13c0 3.04-2.46 5.5-5.5 5.5"/><path d="M5.89 9.71c-2.15 2.15-2.3 5.47-.35 7.43"/><path d="M11 15.5c.5 2.5-.5 4.5-2.5 6.5"/><path d="M13 17.5c.75 1.5 1.25 3.5 1.25 4.5"/><path d="M14.5 9c2.34-1 4.5 1 4.5 3 0 1.5-1.5 3-3 3"/><path d="M18.5 13c.5 1 .5 2 0 3"/><path d="M9.5 5.5c0-1.5 1.5-2.5 3-2.5 1.5 0 2.5 1.5 2.5 2.5"/></g>,
                Star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            };

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [gameState, setGameState] = useState('START');
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [scores, setScores] = useState({
                italy: 0, uk: 0, france: 0, santorini: 0, barcelona: 0, eurovision: 0, ibiza: 0
            });

            const hannahPhotos = {
                blueDress: "./images/blue_dress.jpg",
                redDress: "./images/red_dress.jpg",
                karaokeFull: "./images/karaoke_full.jpg",
                karaokeClose: "./images/karaoke_close.jpg",
                orangeDress: "./images/orange_dress.jpg",
                greenDress: "./images/green_dress.jpg",
                yellowDress: "./images/yellow_dress.jpg",
            };

            const questions = [
                {
                    text: "It's 4:00 PM and the 'imaginary' flight has landed. What's your first move?",
                    options: [
                        { text: "Straight to the pool for a cool dip.", category: 'italy' },
                        { text: "Finding the nearest patch of grass for a game of cornhole.", category: 'uk' },
                        { text: "Scouting the best lighting for a sunset photo.", category: 'santorini' },
                        { text: "Heading to the bar to see what's on tap.", category: 'barcelona' }
                    ]
                },
                {
                    text: "Pick your signature Euro Summer 'hydration' method:",
                    options: [
                        { text: "A refreshing Pimms with all the fruit.", category: 'uk' },
                        { text: "A crisp Spritz with a side of French cheese.", category: 'france' },
                        { text: "Whatever is cold, bubbly, and looks good in a flute.", category: 'santorini' },
                        { text: "A round of shots for the whole group!", category: 'ibiza' }
                    ]
                },
                {
                    text: "What does your 'Euro Summer Chic' outfit look like?",
                    options: [
                        { text: "A flowy linen set for maximum comfort.", category: 'france' },
                        { text: "A bright floral dress and oversized shades.", category: 'santorini' },
                        { text: "Swimwear that doubles as an outfit.", category: 'italy' },
                        { text: "Sequins, glitter, and dancing shoes.", category: 'eurovision' }
                    ]
                },
                {
                    text: "The music starts playing. What are you doing?",
                    options: [
                        { text: "Grabbing the mic—I know every word to 'Mamma Mia'.", category: 'eurovision' },
                        { text: "Putting my headphones on and disappearing into the beat.", category: 'ibiza' },
                        { text: "Nodding along while finishing my third plate of Paella.", category: 'barcelona' },
                        { text: "Classic pub singalong with the besties.", category: 'uk' }
                    ]
                },
                {
                    text: "Which of these sounds like your ideal holiday 'vibe'?",
                    options: [
                        { text: "Lazy afternoons and refreshing swims.", category: 'italy' },
                        { text: "Sophisticated snacks and sunset views.", category: 'france' },
                        { text: "High energy, late nights, and zero sleep.", category: 'ibiza' },
                        { text: "A perfect mix of culture, food, and fun.", category: 'barcelona' }
                    ]
                },
                {
                    text: "Finally, what's your party superpower?",
                    options: [
                        { text: "The Entertainer: Keeping the karaoke stage alive.", category: 'eurovision' },
                        { text: "The Foodie: Knowing exactly where the cheese board is.", category: 'france' },
                        { text: "The Aesthetic: Making sure everyone has a drink in hand.", category: 'santorini' },
                        { text: "The MVP: Being the last one standing on the dancefloor.", category: 'ibiza' }
                    ]
                }
            ];

            const results = {
                italy: {
                    title: "The Italian Riviera Hannah",
                    desc: "You are the 'Check-In' Hannah! You're all about those first-day vibes, refreshing swims, and keeping it cool. You’re the person who ensures the pool is at the perfect temperature before everyone else jumps in.",
                    icon: <Icon name="Sun" className="w-8 h-8 text-yellow-500" />,
                    color: "bg-emerald-50 text-emerald-800 border-emerald-200",
                    image: hannahPhotos.yellowDress
                },
                uk: {
                    title: "The UK Country Pub Hannah",
                    desc: "You are the 'Lawn Game Legend'! You love a Pimms, a bit of friendly competition, and the cozy vibes of a summer afternoon.",
                    icon: <Icon name="Map" className="w-8 h-8 text-blue-600" />,
                    color: "bg-blue-50 text-blue-800 border-blue-200",
                    image: hannahPhotos.greenDress
                },
                france: {
                    title: "The Aperitivo in France Hannah",
                    desc: "You are 'Sophisticated & Snack-Ready'. You appreciate the finer things in life—like a perfectly paired cheese board and a crisp spritz.",
                    icon: <Icon name="Wine" className="w-8 h-8 text-red-500" />,
                    color: "bg-red-50 text-red-800 border-red-200",
                    image: hannahPhotos.redDress
                },
                santorini: {
                    title: "The Santorini Sunset Hannah",
                    desc: "You are the 'Golden Hour Goddess'. You have an eye for beauty, a love for a great view, and you always have a drink ready.",
                    icon: <Icon name="Camera" className="w-8 h-8 text-sky-500" />,
                    color: "bg-sky-50 text-sky-800 border-sky-200",
                    image: hannahPhotos.blueDress
                },
                barcelona: {
                    title: "The Barcelona Night Vibes Hannah",
                    desc: "You are the 'Late Night Foodie'. You love the buzz of a summer evening, the smell of paella, and city energy.",
                    icon: <Icon name="Palmtree" className="w-8 h-8 text-orange-500" />,
                    color: "bg-orange-50 text-orange-800 border-orange-200",
                    image: hannahPhotos.orangeDress
                },
                eurovision: {
                    title: "The Eurovision After Dark Hannah",
                    desc: "You are the 'Karaoke Queen'! With main character energy and a love for ABBA, you are the one who gets everyone on their feet.",
                    icon: <Icon name="Music" className="w-8 h-8 text-purple-600" />,
                    color: "bg-purple-50 text-purple-800 border-purple-200",
                    image: hannahPhotos.karaokeFull
                },
                ibiza: {
                    title: "The Finish the Night in Ibiza Hannah",
                    desc: "You are the 'Silent Disco Star'. You're the night owl who thrives in the strobe lights and keeps the energy high.",
                    icon: <Icon name="Plane" className="w-8 h-8 text-indigo-600" />,
                    color: "bg-indigo-50 text-indigo-800 border-indigo-200",
                    image: hannahPhotos.karaokeClose
                }
            };

            const handleAnswer = (category) => {
                setScores(prev => ({ ...prev, [category]: prev[category] + 1 }));
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    setGameState('RESULT');
                }
            };

            const getWinner = () => {
                return Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            };

            const resetQuiz = () => {
                setScores({ italy: 0, uk: 0, france: 0, santorini: 0, barcelona: 0, eurovision: 0, ibiza: 0 });
                setCurrentQuestion(0);
                setGameState('START');
            };

            const winnerKey = getWinner();
            const result = results[winnerKey];

            return (
                <div className="min-h-screen bg-[#F0F9FF] flex flex-col items-center p-4 font-sans text-slate-800 relative overflow-x-hidden">
                    <div className="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden mt-4 mb-8 border-[6px] border-white">
                        <div className="bg-[#1E40AF] p-10 text-center text-white relative">
                            <h1 className="text-4xl font-black italic mb-2 tracking-tight">Euro Summer 30th</h1>
                            <p className="text-sky-200 text-xs font-bold uppercase tracking-[0.2em]">Which Hannah are you?</p>
                        </div>

                        <div className="p-8">
                            {gameState === 'START' && (
                                <div className="text-center py-4">
                                    <div className="mb-8 flex justify-center text-sky-500">
                                        <Icon name="Plane" size={80} className="animate-bounce" />
                                    </div>
                                    <h2 className="text-3xl font-black mb-4">Thirty & Touring! 🇪🇺</h2>
                                    <button 
                                        onClick={() => setGameState('QUIZ')}
                                        className="w-full bg-[#1E40AF] hover:bg-blue-800 text-white font-black py-5 rounded-3xl transition-all shadow-lg flex items-center justify-center gap-3 text-xl"
                                    >
                                        Start Journey <Icon name="ChevronRight" size={24} />
                                    </button>
                                </div>
                            )}

                            {gameState === 'QUIZ' && (
                                <div>
                                    <h2 className="text-2xl font-black mb-8 min-h-[4.5rem] leading-tight text-slate-900">
                                        {questions[currentQuestion].text}
                                    </h2>
                                    <div className="space-y-4">
                                        {questions[currentQuestion].options.map((opt, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleAnswer(opt.category)}
                                                className="w-full text-left p-5 rounded-2xl border-2 border-slate-50 hover:border-sky-500 hover:bg-sky-50 transition-all font-bold flex items-center justify-between shadow-sm"
                                            >
                                                {opt.text}
                                                <Icon name="ChevronRight" size={18} className="text-slate-300" />
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {gameState === 'RESULT' && (
                                <div className="text-center">
                                    <div className="relative mb-8 transform -rotate-2">
                                        <div className="bg-white p-3 pb-12 shadow-2xl border border-slate-100 rounded-sm">
                                           <div className="aspect-[4/5] overflow-hidden rounded-sm bg-slate-100 flex items-center justify-center">
                                                <img 
                                                    src={result.image} 
                                                    alt="Hannah Persona" 
                                                    className="w-full h-full object-cover"
                                                    onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1520933566089-8d25927231d7?auto=format&fit=crop&q=80&w=400"; }}
                                                />
                                           </div>
                                           <div className="absolute bottom-4 left-0 right-0">
                                              <p className="text-slate-400 font-handwriting text-xl text-center italic">Summer '26 Memories</p>
                                           </div>
                                        </div>
                                    </div>
                                    <h3 className="text-2xl font-black text-sky-900 mb-4">{result.title}</h3>
                                    <p className="text-slate-600 mb-8 leading-relaxed font-medium">{result.desc}</p>
                                    <button 
                                        onClick={resetQuiz}
                                        className="w-full bg-slate-900 text-white font-black py-5 rounded-3xl flex items-center justify-center gap-3 hover:bg-slate-800 shadow-xl"
                                    >
                                        <Icon name="RefreshCw" size={18} /> Re-take Quiz
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
